# The gates — the three CLAUDE.md names plus both solver suites (v2 only on a PR
# that touches it, ADR-0064) — run by a machine instead of asserted by a human. Before this existed, "gates green" was a claim in
# a chat log: `main` auto-deploys to production, so nothing mechanical stood between
# a red test suite and the team's app. This is that thing.
#
# Three jobs do the work, in parallel: `node` (tsc, vitest, eslint), `solver-v2`
# (the v2 CP-SAT solver, gcf/ — the rollback engine since ADR-0056) and `solver-v3`
# (gcf_v3/). `scope` decides, on a pull request only, whether `solver-v2` runs at
# all (ADR-0064). A fifth, `gates`, runs no test of its own: it is the ONE check
# `main`'s branch protection requires, and it is green only when every other job
# here concluded `success` — or, for `solver-v2` alone, `skipped` because `scope`
# said the PR does not touch it. It aggregates rather than tests because GitHub
# counts a SKIPPED required check as passing, so a plain `needs:` would turn every
# red suite into a green merge. Adding a job means adding it to `gates.needs`;
# scripts/__tests__/ciLayout.test.ts fails until you do.
# See docs/CI.md «Why `gates` is an aggregator».
#
# Deliberately NOT here: Playwright e2e (needs live Sanity credentials and the
# real dataset — see e2e/service-readiness/) and `next build` (Vercel already
# builds every push, and a second build would double CI time to re-prove it).
name: CI

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete. PR runs are
# keyed separately so a PR and its branch push do not cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every timeout below follows one rule — at least twice the job's latest measured
# time — and the measurements live in docs/CI.md «Timing», not here.
jobs:
  node:
    name: node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `ci` not `install`: fails on a lockfile that drifted from package.json
      # rather than silently resolving something new.
      - name: Install
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      # Warnings are a deliberate backlog (eslint.config.mjs); errors are not.
      # `--max-warnings` is intentionally absent so the backlog does not fail
      # the gate, matching what CLAUDE.md asks of a local run.
      - name: Lint
        run: npx eslint .

  # The CP-SAT solver has its own suite and nothing ran it: a `gcf/**`-only PR
  # went green on a job that never looked at the file, on code that deploys to
  # the Cloud Function from `main` with no `preview` rehearsal. 3.12 matches the
  # function's own `--runtime=python312` (cloudbuild.yaml).
  #
  # One x86_64 Linux runner, once per run, never a matrix: GOLDEN_SCHEDULE in
  # gcf/test_inertness.py is enforced only on Linux x86_64 and, inside Actions,
  # FAILS instead of skipping anywhere else (docs/CI.md «Solver inertness goldens»).
  #
  # Since v2 became the rollback engine, a pull request that touches neither gcf/
  # nor the CI machinery skips this job (~10 of the run's ~10.5 minutes): `scope`
  # says "false" and `gates` accepts the skip on that word only. Anything else
  # (a push, a manual run, an unreadable diff, a `scope` that wrote nothing) runs
  # it. ADR-0064; docs/CI.md «Scoped skip of solver-v2».
  solver-v2:
    name: solver-v2
    needs: scope
    if: ${{ needs.scope.outputs.solver-v2 != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: gcf/requirements.txt

      - name: Solver deps
        run: pip install -r gcf/requirements.txt

      - name: Solver tests
        run: python -m unittest discover -s gcf -t gcf -v

  # The v3 solver (gcf_v3/, package `owt_v3`), in its own job so its suite adds
  # nothing to v2's wall time. Same shape as solver-v2. Until the v3 solver lands
  # it runs one scaffold smoke test; the import ban between the two trees is the
  # guard's, because both jobs run from the repository root (docs/CI.md «Solver
  # suites»).
  solver-v3:
    name: solver-v3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: gcf_v3/requirements.txt

      - name: Solver deps
        run: pip install -r gcf_v3/requirements.txt

      - name: Solver tests
        run: python -m unittest discover -s gcf_v3 -t gcf_v3 -v

  # Which skippable jobs this run needs (scripts/lib/ci-scope.mjs). Only pull
  # requests are ever scoped; depth 2 fetches the merge commit's parents, so the
  # diff is the PR's merge commit against the base tip it merged onto.
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      solver-v2: ${{ steps.decide.outputs.solver-v2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decide
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci/ci-scope.mjs

  # THE REQUIRED CHECK. Its name is what branch protection matches; do not rename it.
  gates:
    name: gates
    needs: [node, solver-v2, solver-v3, scope]
    # NEVER let this job be skipped. Without `always()`, one red job above skips
    # `gates`, and GitHub treats a skipped required check as PASSING — the PR
    # merges red. `!cancelled()` is not enough either: a cancelled run would skip
    # it. With `always()` it always runs, and the verdict below decides.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Exit 0 only if every job in `needs` concluded `success` (or is a skip that
      # `scope` vouched for, see above); it names any that did not. The job data
      # travels through `env:`, never into the shell source.
      # Node builtins only, so the runner's preinstalled Node runs it: no
      # setup-node, no `npm ci`.
      - name: Verdict
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/gates-verdict.mjs
