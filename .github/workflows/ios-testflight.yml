# Uploads a build of the native iPhone/iPad app (native/ios, ADR-0091) to TestFlight.
# Run by hand only: Actions -> «iOS TestFlight» -> Run workflow, from main. Nothing triggers it
# on a push, because every upload is a build testers receive.
#
# Signing is Xcode's automatic signing driven by an App Store Connect API key (docs/SECRETS.md):
# `-allowProvisioningUpdates` lets Xcode create the development certificate and the provisioning
# profiles it needs, and the export uploads. The key keeps the Admin role so Xcode may manage
# certificates and profiles without a person in the loop.
#
# The distribution signature comes from an Apple Distribution certificate of our own (IOS_DIST_P12,
# imported into a throwaway keychain), NOT from Xcode's cloud-managed one: the first upload
# (2026-11-24, run 1) was signed in the cloud and App Store Connect refused it as «Invalid
# Signature»; with a local Apple Distribution identity the export signs with it instead.
#
# The key's three secrets and the certificate's two live in the `testflight` ENVIRONMENT, not the
# repository: the environment admits only `main`, so a workflow pushed on any other branch cannot
# read an Admin key or the certificate. The `if:` below only skips a run started elsewhere; the
# environment is the boundary.
#
# Build number = "<run number>.<attempt>" (project.yml maps CFBundleVersion to it), so every upload,
# a re-run included, is higher than the last: App Store Connect refuses a repeated number. The run
# number belongs to this file: renaming it restarts at 1, so bump MARKETING_VERSION if you ever do. The
# version shown to testers is project.yml's MARKETING_VERSION. Built with Xcode 26 because App
# Store Connect refuses an older SDK. Not part of ci.yml's `gates`, like ios.yml (docs/CI.md).
name: iOS TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    environment: testflight
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 on this runner; App Store Connect refuses builds from an older SDK."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: native/ios
        run: xcodegen generate
      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error::ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 must be secrets of the testflight environment (docs/SECRETS.md)."
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Install the Apple Distribution certificate
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          if [ -z "$IOS_DIST_P12" ] || [ -z "$IOS_DIST_P12_PASSWORD" ]; then
            echo "::error::IOS_DIST_P12 and IOS_DIST_P12_PASSWORD must be secrets of the testflight environment (docs/SECRETS.md)."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass=$(openssl rand -hex 24)
          echo "::add-mask::$kc_pass"
          security create-keychain -p "$kc_pass" "$keychain"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          printf '%s' "$IOS_DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -f pkcs12 -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # The runner image may lack Apple's WWDR G3 intermediate, which signs every Apple
          # Distribution certificate; without it the chain does not validate and `-v` finds nothing.
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$keychain" -T /usr/bin/codesign || true
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "Apple Distribution"; then
            # Counts and trust codes only: never an identity's name.
            echo "Identities with a private key (any validity): $(security find-identity -p codesigning "$keychain" | grep -c 'Apple Distribution' || true)"
            echo "Certificates in the keychain: $(security find-certificate -a "$keychain" | grep -c '"labl"' || true)"
            security find-identity -p codesigning "$keychain" | grep -o '(CSSMERR[^)]*)' | sort | uniq -c || true
            echo "::error::IOS_DIST_P12 holds no VALID Apple Distribution identity. 0 identities above = the .p12 has no private key (export it from «Mis certificados»); a CSSMERR code = expired, revoked or untrusted."
            exit 1
          fi
          security find-identity -v -p codesigning "$keychain" | grep -c "Apple Distribution" | sed 's/^/Apple Distribution identities: /'
      - name: Archive
        working-directory: native/ios
        run: |
          set +e
          xcodebuild archive -project Backstage.xcodeproj -scheme Backstage -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Backstage.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" > archive.log 2>&1
          status=$?
          grep -E "error:|warning: .*(sign|provision)|\*\* " archive.log
          if [ "$status" -ne 0 ]; then tail -n 80 archive.log; fi
          exit "$status"
      - name: Sign and upload to TestFlight
        working-directory: native/ios
        run: |
          set +e
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Backstage.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > export.log 2>&1
          status=$?
          grep -E "error:|Upload|\*\* " export.log
          if [ "$status" -ne 0 ]; then tail -n 80 export.log; fi
          exit "$status"
      - name: Remove the key and the certificate
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/dist.p12"
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
