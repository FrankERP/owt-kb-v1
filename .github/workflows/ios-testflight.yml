# Uploads a build of the native iPhone/iPad app (native/ios, ADR-0091) to TestFlight.
# Run by hand only: Actions -> «iOS TestFlight» -> Run workflow, from main. Nothing triggers it
# on a push, because every upload is a build testers receive.
#
# Signing is MANUAL, with two things of our own (docs/SECRETS.md): the Apple Distribution certificate
# (IOS_DIST_P12, imported into a throwaway keychain) and the App Store provisioning profile made for
# it (IOS_APPSTORE_PROFILE). Both the archive and the export sign with that pair, so a run creates
# NOTHING in the Apple account. Two earlier arrangements, and why they went:
#  - Xcode's cloud-managed distribution signing: the first upload (2026-11-24, run 1) was refused by
#    App Store Connect as «Invalid Signature».
#  - Automatic signing at the archive (`-allowProvisioningUpdates` there): every run starts on an
#    empty machine, so Xcode asked Apple for a NEW development certificate each time and nothing
#    revoked them; run 13 (2026-11-26) stopped at «Your account has reached the maximum number of
#    certificates». The archive now carries no `-allowProvisioningUpdates` and no API key at all.
# The App Store Connect API key is used by the export alone, to upload.
#
# The key's three secrets, the certificate's two and the profile live in the `testflight`
# ENVIRONMENT, not the repository: the environment admits only `main`, so a workflow pushed on any
# other branch cannot read an Admin key or the certificate. The `if:` below only skips a run started elsewhere; the
# environment is the boundary.
#
# Build number = "<run number>.<attempt>" (project.yml maps CFBundleVersion to it), so every upload,
# a re-run included, is higher than the last: App Store Connect refuses a repeated number. The run
# number belongs to this file: renaming it restarts at 1, so bump MARKETING_VERSION if you ever do. The
# version shown to testers is project.yml's MARKETING_VERSION. Built on the `xcode-27` image with its
# newest Xcode 27: from April 2027 App Store Connect refuses an upload without the iOS 27 SDK
# (ITMS-90725), and `macos-26` carries only Xcode 26. Not part of ci.yml's `gates`, like ios.yml
# (docs/CI.md).
name: iOS TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    environment: testflight
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode 27
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 27 on this runner; from April 2027 App Store Connect refuses builds without the iOS 27 SDK (ITMS-90725)."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: native/ios
        run: xcodegen generate
      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error::ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 must be secrets of the testflight environment (docs/SECRETS.md)."
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Install the Apple Distribution certificate
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          if [ -z "$IOS_DIST_P12" ] || [ -z "$IOS_DIST_P12_PASSWORD" ]; then
            echo "::error::IOS_DIST_P12 and IOS_DIST_P12_PASSWORD must be secrets of the testflight environment (docs/SECRETS.md)."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass=$(openssl rand -hex 24)
          echo "::add-mask::$kc_pass"
          security create-keychain -p "$kc_pass" "$keychain"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          printf '%s' "$IOS_DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -f pkcs12 -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # The runner image may lack the Apple WWDR intermediate that signed the certificate (G3 today;
          # G4-G6 exist); without it the chain does not validate and `-v` finds nothing. An intermediate
          # is never a trust anchor: it still has to chain to Apple Root CA.
          for g in G3 G4 G5 G6; do
            if curl -fsSL --retry 3 -o "$RUNNER_TEMP/AppleWWDRCA$g.cer" "https://www.apple.com/certificateauthority/AppleWWDRCA$g.cer"; then
              security import "$RUNNER_TEMP/AppleWWDRCA$g.cer" -k "$keychain" > /dev/null || true
            else
              echo "::warning::Could not download Apple's WWDR $g intermediate."
            fi
          done
          if ! security find-identity -v -p codesigning "$keychain" | grep -qE "(Apple|iPhone) Distribution"; then
            # Counts, trust codes and Apple's CA names only: never an identity's name.
            echo "Identities with a private key (any validity): $(security find-identity -p codesigning "$keychain" | grep -cE '^ +[0-9]+\) [0-9A-F]{40}' || true)"
            security find-identity -p codesigning "$keychain" | grep -o '(CSSMERR[^)]*)' | sort | uniq -c || true
            echo "Issuers of the certificates in the keychain:"
            security find-certificate -a -p "$keychain" | awk '/BEGIN CERT/{n++} {print > (ENVIRON["RUNNER_TEMP"] "/cert" n ".pem")}'
            for c in "$RUNNER_TEMP"/cert*.pem; do
              openssl x509 -in "$c" -noout -issuer -nameopt sep_comma_plus,space_eq | grep -oE '(CN|OU) = [^,]*' | paste -sd' ' - || true
            done
            rm -f "$RUNNER_TEMP"/cert*.pem
            echo "::error::IOS_DIST_P12 holds no VALID distribution identity. 0 identities above = the .p12 has no private key (export it from «My Certificates»); a CSSMERR code = expired, revoked or untrusted (an issuer OU other than G3-G6 = a newer Apple intermediate)."
            exit 1
          fi
          security find-identity -v -p codesigning "$keychain" | grep -cE "(Apple|iPhone) Distribution" | sed 's/^/Distribution identities: /'
      - name: Install the App Store provisioning profile
        env:
          IOS_APPSTORE_PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
        run: |
          if [ -z "$IOS_APPSTORE_PROFILE" ]; then
            echo "::error::IOS_APPSTORE_PROFILE must be a secret of the testflight environment (docs/SECRETS.md)."
            exit 1
          fi
          profile="$RUNNER_TEMP/appstore.mobileprovision"
          plist="$RUNNER_TEMP/appstore-profile.plist"
          # A value that is not base64 leaves an empty or broken file: the next check says so.
          printf '%s' "$IOS_APPSTORE_PROFILE" | base64 --decode > "$profile" || true
          if ! security cms -D -i "$profile" -o "$plist" 2> /dev/null; then
            echo "::error::IOS_APPSTORE_PROFILE is not a provisioning profile (base64 of the downloaded .mobileprovision, one line)."
            exit 1
          fi
          read_key() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist" 2> /dev/null; }
          uuid=$(read_key UUID || true)
          app_id=$(read_key Entitlements:application-identifier || true)
          # A profile is not a secret, but only what a fix needs is printed: its app and expiry.
          echo "Profile for: ${app_id:-unknown} · expires: $(read_key ExpirationDate || true)"
          if ! printf '%s' "$uuid" | grep -qE '^[0-9A-Fa-f-]{36}$'; then
            echo "::error::The profile has no UUID."
            exit 1
          fi
          if [ "$app_id" != "2NM4872N5S.com.owtBackstage.app" ]; then
            echo "::error::The profile is for another app: it must be made for com.owtBackstage.app of team 2NM4872N5S."
            exit 1
          fi
          # An App Store profile lists no devices and cannot be debugged; anything else cannot go to TestFlight.
          if read_key ProvisionedDevices > /dev/null || [ "$(read_key ProvisionsAllDevices)" = "true" ] || [ "$(read_key Entitlements:get-task-allow)" = "true" ]; then
            echo "::error::The profile is a development, ad hoc or enterprise one. Make it under Distribution → «App Store Connect»."
            exit 1
          fi
          # The app's one entitlement. Manual signing cannot add it: a profile without it fails the archive.
          if ! read_key Entitlements:com.apple.developer.associated-domains > /dev/null; then
            echo "::error::The profile lacks Associated Domains: enable it on the App ID com.owtBackstage.app, then generate the profile again."
            exit 1
          fi
          # Before the copies, so the cleanup step removes them even if this step stops halfway.
          echo "PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
          # Xcode 16+ reads the second folder; older ones the first.
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile" "$dir/$uuid.mobileprovision"
          done
          rm -f "$profile" "$plist"
      - name: Archive
        working-directory: native/ios
        run: |
          set +e
          # Manual signing with our own pair, and no `-allowProvisioningUpdates`: Xcode has nothing
          # to ask Apple for, so it cannot create a certificate (see the header). These settings reach
          # EVERY target the archive builds: today only `Backstage`. The day an extension or a Swift
          # package joins it, move them into project.yml under that target's Release config.
          xcodebuild archive -project Backstage.xcodeproj -scheme Backstage -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Backstage.xcarchive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" DEVELOPMENT_TEAM=2NM4872N5S \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" > archive.log 2>&1
          status=$?
          grep -E "error:|warning: .*(sign|provision)|\*\* " archive.log
          if [ "$status" -ne 0 ]; then tail -n 80 archive.log; fi
          exit "$status"
      - name: Sign and upload to TestFlight
        working-directory: native/ios
        run: |
          set +e
          # The export signs with the same pair: the profile is named to it by its UUID. The API key
          # is here to UPLOAD; with a manual style, `-allowProvisioningUpdates` creates nothing.
          options="$RUNNER_TEMP/ExportOptions.plist"
          cp ExportOptions.plist "$options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" \
            -c "Add :provisioningProfiles:com.owtBackstage.app string $PROFILE_UUID" "$options" || exit 1
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Backstage.xcarchive" \
            -exportOptionsPlist "$options" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > export.log 2>&1
          status=$?
          grep -E "error:|Upload|\*\* " export.log
          if [ "$status" -ne 0 ]; then tail -n 80 export.log; fi
          exit "$status"
      - name: Remove the key, the certificate and the profile
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/appstore.mobileprovision" "$RUNNER_TEMP/appstore-profile.plist"
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
