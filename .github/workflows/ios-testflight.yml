# Uploads a build of the native iPhone/iPad app (native/ios, ADR-0091) to TestFlight.
# Run by hand only: Actions -> «iOS TestFlight» -> Run workflow, from main. Nothing triggers it
# on a push, because every upload is a build testers receive.
#
# Signing is Xcode's automatic signing driven by an App Store Connect API key (three repository
# secrets, docs/SECRETS.md): `-allowProvisioningUpdates` lets Xcode create the certificate and the
# provisioning profile it needs, and the export signs in the cloud and uploads. That is why the key
# must have the Admin role: an App Manager key cannot create a distribution certificate.
#
# The build number is this workflow's run number, so every upload is higher than the last one
# (App Store Connect refuses a repeated number). The version shown to testers is project.yml's
# MARKETING_VERSION. Not part of ci.yml's `gates`, like ios.yml (docs/CI.md).
name: iOS TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: native/ios
        run: xcodegen generate
      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error::ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 must be repository secrets (docs/SECRETS.md)."
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Archive
        working-directory: native/ios
        run: |
          set +e
          xcodebuild archive -project Backstage.xcodeproj -scheme Backstage -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Backstage.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" > archive.log 2>&1
          status=$?
          grep -E "error:|warning: .*(sign|provision)|\*\* " archive.log
          if [ "$status" -ne 0 ]; then tail -n 80 archive.log; fi
          exit "$status"
      - name: Sign and upload to TestFlight
        working-directory: native/ios
        run: |
          set +e
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Backstage.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > export.log 2>&1
          status=$?
          grep -E "error:|Upload|\*\* " export.log
          if [ "$status" -ne 0 ]; then tail -n 80 export.log; fi
          exit "$status"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
