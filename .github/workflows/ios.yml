# The native iPhone/iPad app (native/ios, ADR-0091): generate the Xcode project from
# project.yml, then build and run its unit tests on a Simulator. A cloud session runs on
# Linux and cannot compile Swift for iOS, so this job is where the app is compiled at all.
#
# Path-scoped on purpose: it runs only when the app or this file changes. It is NOT part of
# ci.yml's `gates` (main's one required check), because a web change must never wait on a
# macOS runner, and a red iOS build must never block a web hotfix. TestFlight uploads are
# ios-testflight.yml, run by hand. Both run on GitHub's `xcode-27` image (macOS 27) with its newest
# Xcode 27, so the tests compile with the same SDK the upload does: from April 2027 App Store Connect
# refuses an upload built without the iOS 27 SDK (ITMS-90725). `macos-26` carries only Xcode 26.
name: iOS

on:
  push:
    paths:
      - "native/ios/**"
      # The contract fixtures the app's tests read (native/contract, ADR-0091 W1).
      - "native/contract/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "native/ios/**"
      - "native/contract/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode 27
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 27 on this runner; from April 2027 App Store Connect refuses builds without the iOS 27 SDK (ITMS-90725)."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: native/ios
        run: xcodegen generate
      - name: Pick a Simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build and test
        working-directory: native/ios
        run: |
          set +e
          # SnapshotTests draws the screens to PNG here (xcodebuild hands TEST_RUNNER_* to the tests
          # without the prefix); the next step uploads them, so a session can look at the app.
          export TEST_RUNNER_SNAPSHOT_DIR="$RUNNER_TEMP/snapshots"
          xcodebuild test -project Backstage.xcodeproj -scheme Backstage -destination "id=${{ steps.sim.outputs.udid }}" CODE_SIGNING_ALLOWED=NO > xcodebuild.log 2>&1
          status=$?
          grep -E "error:|Test Case .*(passed|failed)|Executed|\*\* " xcodebuild.log
          if [ "$status" -ne 0 ]; then tail -n 80 xcodebuild.log; fi
          exit "$status"
      - name: Upload the screen snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: warn
          retention-days: 7
