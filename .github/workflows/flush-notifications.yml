# Layer 1 of the notification outbox's three flush triggers (design spec §3).
#
# Vercel Hobby allows ONE cron per day, so the every-five-minutes trigger lives
# here instead of in `vercel.json` — do not add a second Vercel cron. This job is
# a thin caller: it curls the route, and the route calls the one exported sweep.
#
# Two operational properties, named rather than discovered:
#   · GitHub's scheduled runs are routinely 5–15 minutes late. That makes an
#     email later, never wrong.
#   · GitHub DISABLES scheduled workflows after 60 days of repository inactivity,
#     and that rule applies to public repositories like this one. The daily
#     liveness alarm in /api/cron/service-reminders is what makes that state loud
#     (detection window up to 48 h); `workflow_dispatch` is how you re-arm it.
#
# Repository secrets required: CRON_SECRET (the same value as the Vercel env var)
# and APP_BASE_URL (e.g. https://oasisworship.vercel.app, no trailing slash).
name: Flush notification outbox

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# This job curls one URL. It touches no repository contents and needs no
# GITHUB_TOKEN at all, so it gets none.
permissions: {}

# A run that hangs on a slow sweep would otherwise still be in flight when the
# next five-minute tick fires. The sweep claims before it sends, so an overlap is
# not a double-send — but two concurrent sweeps do split one backlog and pile
# onto an SMTP transport with `maxConnections: 1`. Newer wins: a skipped tick is
# five minutes, and there is always another one.
concurrency:
  group: flush-notification-outbox
  cancel-in-progress: false

jobs:
  flush:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the sweep
        # Via `env:`, not interpolated into the script. GitHub masks secrets in
        # logs either way, but `${{ }}` in a `run:` block composes the value into
        # the command line itself — visible to `ps`, and one stray `set -x` or
        # error echo away from being printed. Quoted, so a value with shell
        # metacharacters cannot break out.
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/flush-notifications"
