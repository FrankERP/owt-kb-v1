# Layer 1 of the notification outbox's three flush triggers (design spec §3).
#
# Vercel Hobby allows ONE cron per day, so the sub-daily trigger lives
# here instead of in `vercel.json` — do not add a second Vercel cron. This job is
# a thin caller: it curls the route, and the route calls the one exported sweep.
#
# Two operational properties, named rather than discovered:
#   · GitHub's scheduled runs are routinely far later than the declared schedule,
#     and it got worse. Over 98 runs: median 41 min, max 11.4 h, never within 10.
#     Re-measured 2026-08-30 over 39 intervals: median 71 min, p90 7.0 h, max
#     11.6 h, 22 of 39 over an hour — and only 40 runs delivered against ~1 193
#     expected, a 3.4% delivery rate. That makes an email later, never wrong.
#
#     EXPERIMENT IN FLIGHT (started 2026-08-30, issue #25). The schedule was
#     `*/5 * * * *`; it is now `7,22,37,52`. Hypothesis: GitHub deprioritizes
#     aggressive schedules on public repos, so asking for less may DELIVER more.
#     The offset minutes deliberately avoid :00/:15/:30/:45, the most contended
#     ticks — which conflates two variables on purpose, because both point the
#     same way and the cheap experiment is worth more than the clean one here.
#     Re-measure with the method in #25 before concluding anything, and revert to
#     `*/5` if delivery does not improve.
#   · GitHub DISABLES scheduled workflows after 60 days of repository inactivity,
#     and that rule applies to public repositories like this one. The daily
#     liveness alarm in /api/cron/service-reminders is what makes that state loud
#     (detection window up to 48 h); `workflow_dispatch` is how you re-arm it.
#
# Repository secrets required: CRON_SECRET (the same value as the Vercel env var)
# and APP_BASE_URL (e.g. https://oasisworship.vercel.app, no trailing slash).
name: Flush notification outbox

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# This job curls one URL. It touches no repository contents and needs no
# GITHUB_TOKEN at all, so it gets none.
permissions: {}

# A run that hangs on a slow sweep would otherwise still be in flight when the
# next tick fires. The sweep claims before it sends, so an overlap is
# not a double-send — but two concurrent sweeps do split one backlog and pile
# onto an SMTP transport with `maxConnections: 1`. Newer wins: a skipped tick is
# nominally five minutes (in practice far more), and there is always another one.
concurrency:
  group: flush-notification-outbox
  cancel-in-progress: false

jobs:
  flush:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the sweep
        # Via `env:`, not interpolated into the script. GitHub masks secrets in
        # logs either way, but `${{ }}` in a `run:` block composes the value into
        # the command line itself — visible to `ps`, and one stray `set -x` or
        # error echo away from being printed. Quoted, so a value with shell
        # metacharacters cannot break out.
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          # 90, not 60. The route declares `maxDuration = 60` and the sweep may
          # legitimately spend its full 40 s send budget plus the read phase plus
          # TLS setup; a 60 s client timeout would cut a HEALTHY run short and
          # turn it red. Going red is layer 1's ONLY failure signal, so a
          # spurious red erodes the one thing that makes a real failure visible.
          # The 5-minute job timeout is still the real backstop.
          #
          # Assert 200 explicitly rather than relying on `curl --fail`, which
          # treats only 4xx/5xx as errors. A 3xx passes it — and that is not
          # hypothetical: the session middleware once matched `/api/cron/*` and
          # answered with a 307 to the sign-in page, so this job reported green
          # for every run while the sweep never executed once. A silent no-op
          # that looks healthy is the worst failure this trigger can have.
          BODY=$(mktemp)
          CODE=$(curl --silent --show-error --max-time 90 \
            -o "$BODY" -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/flush-notifications")
          echo "HTTP $CODE"
          cat "$BODY"
          echo
          if [ "$CODE" != "200" ]; then
            echo "::error::Expected HTTP 200 from the flush route, got $CODE"
            exit 1
          fi

          # A 200 is not the same as "everyone was told". `lost` counts recipients
          # whose notices were consumed despite never being attempted — destroyed,
          # not retried. `unserved` may be > 0 when the send budget stops early;
          # those are re-pended for the next sweep and are not loss. Going red on
          # `lost` is the only signal that mail was permanently discarded.
          LOST=$(sed -n 's/.*"lost":\([0-9]*\).*/\1/p' "$BODY")

          # `failed` is the OTHER destroyed class, and `lost` cannot see it.
          # `sendOne` marks a recipient attempted BEFORE awaiting, so the
          # at-most-once contract holds — which means a send that fails is
          # discharged exactly like one that succeeds, and its notice is consumed.
          # At SEND_CONCURRENCY = 8 a single provider throttle destroys up to
          # eight at once, and Gmail throttles per ACCOUNT, so it arrives as a
          # wave rather than as one bad address. The mail is gone either way and
          # nothing else would say so — but the THRESHOLD is what makes it a
          # usable signal rather than noise; see below.
          FAILED=$(sed -n 's/.*"failed":\([0-9]*\).*/\1/p' "$BODY")

          # `skipped` first, so a red run still carries the context you want while
          # triaging it. A WARNING, not an error: EMAIL_ALLOWLIST narrowed on
          # purpose makes this the expected state.
          SKIPPED=$(sed -n 's/.*"skipped":\([0-9]*\).*/\1/p' "$BODY")
          if [ -n "$SKIPPED" ] && [ "$SKIPPED" -gt 0 ]; then
            echo "::warning::Sweep skipped $SKIPPED recipient(s) with no address or blocked by the allowlist. See notify_sweep_recipient_skipped."
          fi

          # RED AT TWO, NOT AT ONE, and the threshold is the whole point.
          # A single failure is usually one undeliverable address — a typo in a
          # member's email that Gmail rejects at RCPT. Going red on 1 would recur
          # on every sweep carrying a notice for that member, and this workflow
          # says above that a spurious red erodes the one signal making a real
          # failure visible.
          #
          # `outboxSweep.ts` states a NEIGHBOURING invariant — "a member with a
          # permanently-undeliverable address must never be able to hold the
          # outbox, and therefore the liveness alarm, red forever" — which is
          # about the outbox backlog rather than about this gate. It is the same
          # reasoning applied one layer out, not a direct application, and the
          # threshold stands on its own merits. Two permanently-bad addresses in
          # one sweep still go red every time.
          #
          # TWO OR MORE is the wave shape this gate exists for: SEND_CONCURRENCY
          # is 8 and Gmail throttles per ACCOUNT, so a throttle arrives as a
          # cluster rather than as one bad address.
          if [ -n "$FAILED" ] && [ "$FAILED" -ge 2 ]; then
            echo "::error::Sweep FAILED $FAILED sends in one run — attempted, not delivered, and the notices were consumed anyway. A cluster is the provider-throttle shape. See notify_sweep_send_failed."
            exit 1
          fi
          if [ -n "$FAILED" ] && [ "$FAILED" -eq 1 ]; then
            echo "::warning::Sweep failed 1 send — most likely one undeliverable address. See notify_sweep_send_failed. Red starts at 2."
          fi

          # `lost` LAST, so its exit cannot suppress the annotations above it. It
          # used to sit first, and a sweep that both exhausted its budget AND hit
          # a throttle — the correlated case, since both come from slow sends —
          # annotated only the discarded recipients while eight destroyed sends
          # produced nothing in the run summary.
          if [ -n "$LOST" ] && [ "$LOST" -gt 0 ]; then
            echo "::error::Sweep discarded $LOST recipient(s) unsent — they were claimed, never sent, and deleted. See notify_sweep_send_budget_exhausted."
            exit 1
          fi

