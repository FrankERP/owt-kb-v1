# The operator's answer to "is the mail path healthy, and where does the time go?"
#
# MANUAL ONLY — no `schedule:`. This is a diagnostic you reach for when the outbox
# looks wrong, not a thing that runs on its own. By default it connects, greets,
# authenticates, asks about a recipient and quits: NO MAIL IS SENT, no notice is
# claimed, no member is contacted. That is what makes it safe against production.
#
# The ONE exception is `data: 1`, which submits a real message so that content-
# scanning time can be measured rather than inferred. It is refused for every
# recipient except our own sending mailbox, in the route AND before a socket is
# opened, so it can never become a way to mail a member from a URL.
#
# It exists because reachability from a laptop proves nothing. On 2026-08-06 the
# outbox stalled on SMTP sends that never completed, while the same server
# answered a residential connection in under a second — the question was always
# about Vercel's egress, and there was no way to stand there and look.
#
# Reading the output:
#   · `coldMs`       one full setup: TCP, TLS, greeting, AUTH.
#   · `warmMs`       the SAME pooled transport asked again. Near zero means
#                    pooling works; close to `coldMs` means it does not, and
#                    every message is paying full setup.
#   · `secondColdMs` a second independent setup, so a one-off is distinguishable
#                    from a standing cost.
#
# Repository secrets required: CRON_SECRET and APP_BASE_URL — the same two the
# flush workflow uses. See docs/SECRETS.md.
name: Probe the SMTP path

on:
  workflow_dispatch:
    inputs:
      to:
        description: >-
          Whose address RCPT TO asks about. Blank uses our own mailbox — a LOCAL
          recipient the server verifies without leaving the building. Give an
          EXTERNAL address to see whether Exim is doing a callout to their MTA:
          local fast + external slow is that diagnosis, and it is per-message,
          which is why connection pooling never helped. Nothing is delivered
          either way — the conversation stops before DATA.
        required: false
        default: ""
      repeat:
        description: "Readings to take (1-5). More than one so a figure has variance behind it."
        required: false
        default: "3"
      data:
        description: >-
          Set to 1 to actually submit a message and time DATA — the only option
          here that sends anything. It is refused for every recipient except our
          own sending mailbox, so leave `to` blank when using it. This is what
          measures content-scanning time, which is the one phase a stop-before-
          DATA probe can only infer.
        required: false
        default: "0"
      bytes:
        description: >-
          Body padding for a DATA run. Real notification emails are HTML several
          kilobytes long and scan cost tends to track size, so a timing taken on
          a two-line message understates them. Try 0 and 20000 and compare.
        required: false
        default: "0"

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Measure connect, greeting and AUTH
        # Via `env:`, never interpolated into the script — `${{ }}` in a `run:`
        # block composes the value into the command line itself, visible to `ps`.
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          # Inputs travel through env for the same reason the secrets do: `${{ }}`
          # inside a `run:` block composes the value into the command line.
          PROBE_TO: ${{ inputs.to }}
          PROBE_REPEAT: ${{ inputs.repeat }}
          PROBE_DATA: ${{ inputs.data }}
          PROBE_BYTES: ${{ inputs.bytes }}
        run: |
          BODY=$(mktemp)
          # --get --data-urlencode so an address is escaped rather than pasted
          # into the query string, and an empty `to` still means "our mailbox".
          CODE=$(curl --silent --show-error --max-time 90 --get \
            --data-urlencode "to=${PROBE_TO}" \
            --data-urlencode "repeat=${PROBE_REPEAT:-3}" \
            --data-urlencode "data=${PROBE_DATA:-0}" \
            --data-urlencode "bytes=${PROBE_BYTES:-0}" \
            -o "$BODY" -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/smtp-probe")
          echo "HTTP $CODE"
          cat "$BODY"
          echo
          # Assert 200 explicitly rather than trusting `curl --fail`, which lets
          # a 3xx through — the same trap that once made the flush job report
          # green while the sweep never ran.
          if [ "$CODE" != "200" ]; then
            echo "::error::Expected HTTP 200 from the SMTP probe, got $CODE"
            exit 1
          fi
