# XcodeGen spec for the native iPhone/iPad app (ADR-0091; native/ios/README.md).
# The .xcodeproj is GENERATED from this file and never committed: `xcodegen generate`.
name: Backstage
options:
  bundleIdPrefix: com.owtBackstage
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
  developmentLanguage: es
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "2NM4872N5S"
    CODE_SIGN_STYLE: Automatic
configs:
  Debug: debug
  Release: release
targets:
  Backstage:
    type: application
    platform: iOS
    sources:
      - path: Backstage
    entitlements:
      path: Support/Backstage.entitlements
      properties:
        com.apple.developer.associated-domains:
          - webcredentials:owt-backstage.vercel.app
          - applinks:owt-backstage.vercel.app
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Backstage
        # XcodeGen writes literal "1.0" and "1" unless told otherwise: map them to the build
        # settings so MARKETING_VERSION and the TestFlight run's build number reach the bundle.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        # Unused today: «Agregar al calendario» opens the system's own event sheet, which runs
        # outside the app and asks for no access. Kept so a prompt, if one ever shows, has words.
        NSCalendarsWriteOnlyAccessUsageDescription: Backstage agrega a tu calendario el servicio que elijas.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # A song row dragged inside the proposal editor (ProposalViews.swift): its own type, so no
        # text field or other app takes the drop as text.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.owtBackstage.app.setlist-row
            UTTypeDescription: Canción de una propuesta
            UTTypeConformsTo:
              - public.data
        # A rehearsal mix keeps sounding with the screen locked or another app in front
        # (Backstage/Audio/MixPlayer.swift).
        UIBackgroundModes:
          - audio
        # The web's three faces (app/brandFonts.ts), as static instances of the Google Fonts
        # variable files (OFL; licences beside them in Resources/Fonts).
        UIAppFonts:
          - AdventPro-SemiBold.ttf
          - Urbanist-Regular.ttf
          - Urbanist-SemiBold.ttf
          - Urbanist-ExtraBold.ttf
          - Jura-SemiBold.ttf
        # Debug talks to local `next dev` (the private scheme callback the server accepts only on
        # localhost); Release to production over the verified https callback (AppConfig.swift).
        BackstageOrigin: $(BACKSTAGE_ORIGIN)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owtBackstage.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          BACKSTAGE_ORIGIN: "http://localhost:3000"
        Release:
          BACKSTAGE_ORIGIN: "https://owt-backstage.vercel.app"
  BackstageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BackstageTests
    dependencies:
      - target: Backstage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owtBackstage.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Backstage:
    build:
      targets:
        Backstage: all
        BackstageTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BackstageTests
    archive:
      config: Release
